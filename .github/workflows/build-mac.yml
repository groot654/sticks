# Builds the macOS app (a Mac is required, so this runs on GitHub's macOS runners).
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.1.0 to also attach it to a release.
name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:mac -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Sticks-mac
          path: |
            dist/*.dmg
            dist/*.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
